name: Build OAF (ImmortalWrt snapshot SDK)

# 只用官方 SDK 编译 oaf / appfilter / luci-app-oaf，几分钟即可完成，无需编译整个固件
# 参考: https://github.com/destan19/OpenAppFilter/issues/345

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'ImmortalWrt target (e.g. qualcommax, mediatek, x86)'
        required: true
        default: 'qualcommax'
      subtarget:
        description: 'ImmortalWrt subtarget (e.g. ipq60xx, filogic, 64)'
        required: true
        default: 'ipq60xx'
  push:
    branches: [multi-bridge]
    paths:
      - 'oaf/**'
      - 'open-app-filter/**'
      - 'luci-app-oaf/**'
      - '.github/workflows/build-snapshot.yml'

env:
  TARGET: ${{ inputs.target || 'qualcommax' }}
  SUBTARGET: ${{ inputs.subtarget || 'ipq60xx' }}
  BASE_URL: https://downloads.immortalwrt.org/snapshots/targets

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenAppFilter
        uses: actions/checkout@v4
        with:
          path: OpenAppFilter

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip \
            zlib1g-dev file wget zstd xz-utils python3-pyelftools

      - name: Resolve snapshot SDK
        id: sdk
        run: |
          URL="$BASE_URL/$TARGET/$SUBTARGET"
          curl -fsSL "$URL/sha256sums" -o sha256sums
          LINE=$(grep -E "immortalwrt-sdk-.*\.tar\.zst" sha256sums | head -n1)
          [ -n "$LINE" ] || { echo "SDK not found in $URL"; exit 1; }
          SDK_NAME=$(echo "$LINE" | sed -E 's/^[0-9a-f]+ \*?//')
          SDK_SHA=$(echo "$LINE" | cut -d' ' -f1)
          echo "name=$SDK_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SDK_SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL/$SDK_NAME" >> "$GITHUB_OUTPUT"
          echo "SDK: $SDK_NAME"

      - name: Cache SDK archive
        id: cache
        uses: actions/cache@v4
        with:
          path: sdk.tar.zst
          key: sdk-${{ env.TARGET }}-${{ env.SUBTARGET }}-${{ steps.sdk.outputs.sha }}

      - name: Download SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: wget -q -O sdk.tar.zst "${{ steps.sdk.outputs.url }}"

      - name: Extract SDK
        run: |
          mkdir openwrt-sdk
          tar -I zstd -xf sdk.tar.zst -C openwrt-sdk --strip-components=1

      - name: Update feeds (full)
        working-directory: openwrt-sdk
        run: |
          cat feeds.conf.default
          for i in 1 2 3 4 5; do
            ./scripts/feeds update -a && break
            echo "feeds update failed, retry $i"; sleep $((i * 20))
          done
          # feeds 里自带的上游 open-app-filter / luci-app-oaf 会覆盖本仓库同名包，先删掉再重建索引
          find feeds -mindepth 2 -maxdepth 4 \( -name open-app-filter -o -name luci-app-oaf -o -name oaf \) -prune -exec rm -rfv {} +
          ./scripts/feeds update -i
          ./scripts/feeds install -a
          rm -rfv package/feeds/*/open-app-filter package/feeds/*/luci-app-oaf package/feeds/*/oaf

      - name: Add OpenAppFilter
        working-directory: openwrt-sdk
        run: |
          mkdir -p package/OpenAppFilter
          rsync -a --exclude .git --exclude .github "$GITHUB_WORKSPACE/OpenAppFilter/" package/OpenAppFilter/

      - name: Configure
        working-directory: openwrt-sdk
        run: |
          cat > .config <<'CFG'
          CONFIG_PACKAGE_kmod-oaf=m
          CONFIG_PACKAGE_appfilter=m
          CONFIG_PACKAGE_luci-app-oaf=m
          CONFIG_PACKAGE_luci-i18n-oaf-zh-cn=m
          CONFIG_LUCI_LANG_zh_Hans=y
          CFG
          make defconfig
          grep -E "oaf|appfilter|libcurl|libopenssl|zlib" .config

      - name: Compile
        working-directory: openwrt-sdk
        run: |
          # 并行编译时真正的报错会被其它任务的输出淹没；失败后用单线程重跑一次(已编译的依赖会跳过)，只打印末尾，便于看到真正的错误
          for pkg in oaf open-app-filter luci-app-oaf; do
            make package/$pkg/compile V=s -j$(($(nproc) + 1)) || {
              echo "::error::package/$pkg failed, rerun with -j1 to locate the error"
              make package/$pkg/compile V=s -j1 2>&1 | tail -n 150
              exit 1
            }
          done

      - name: Collect apk packages
        working-directory: openwrt-sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          find bin -type f -name '*.apk' \( -name '*oaf*' -o -name 'appfilter*' \) -exec cp -v {} "$GITHUB_WORKSPACE/out/" \;
          ls -l "$GITHUB_WORKSPACE/out"
          [ -n "$(ls -A "$GITHUB_WORKSPACE/out")" ] || { ls -R bin | head -100; exit 1; }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: oaf-${{ env.TARGET }}-${{ env.SUBTARGET }}-snapshot
          path: out/*
          if-no-files-found: error
